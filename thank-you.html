<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | RigidTechPCB</title>
  <link rel="icon" type="image/png" href="web logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .thank-you-card {
      background: #ffffff;
      color: #333333;
      max-width: 620px;
      width: 100%;
      border-radius: 18px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .thank-you-card img {
      max-width: 160px;
      height: auto;
      margin-bottom: 24px;
    }

    .text-purple-bold {
      color: #800080 !important;
      font-weight: 800 !important;
    }

    .btn-home {
      background: #800080;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 26px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
    }

    .btn-home:hover,
    .btn-home:focus {
      background: #650065;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="thank-you-card">
    <img src="cover.png" alt="RigidTechPCB Logo">
    <h1 class="fw-bold mb-3">Thank You!</h1>
    <p class="lead mb-3">Your message has been received.</p>
    <p class="text-muted mb-0">We will check your inquiry and reply as soon as possible.</p>
    <a href="index.html" class="btn-home">Back to Home</a>
  </main>
</body>
</html>
